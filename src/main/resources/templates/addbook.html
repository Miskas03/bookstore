<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
    <head>
        <title>Booklist</title>
        <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
         <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}"/>
    </head>
    <body>
        <h2>Add book</h2>
        <form th:object="${book}" th:action="@{save}" action="#" method="get">
            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}" class = "form-control"/>
            <label for="isbn">ISBN</label>
            <input type="text" id = "isbn" th:field="*{isbn}" class="form-control"/>
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" class="form-control"/>
            <label for="title">Publication year</label>
            <input type="text" id="publicationYear" th:field="*{publicationYear}" class="form-control"/>
            <select name = "category">
                <option th:each = "cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">
                </option>
            </select>

            <input type="submit" class="btn btn-primary" value="Save"></input>
        </form>
    </body>
